name: Deploy Documentation to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docToolchainConfig.groovy'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup docToolchain
        run: |
          curl -Lo dtcw https://doctoolchain.org/dtcw
          chmod +x dtcw
          ./dtcw local install doctoolchain
      - name: Sync Markdown sources from docs/
        run: rsync -a docs/ src/docs/
      - name: Convert Markdown to AsciiDoc
        run: ./dtcw exportMarkdown
        continue-on-error: true
      - name: Copy converted files
        run: |
          for dir in en de; do
            [ -d "build/$dir" ] && find "build/$dir" -name '*.adoc' -exec sh -c '
              for f; do
                rel="${f#build/}"
                mkdir -p "src/docs/$(dirname "$rel")"
                cp "$f" "src/docs/$rel"
              done
            ' sh {} +
          done
      - name: Remove Markdown sources (conflict with .adoc in jBake)
        run: find src/docs -name '*.md' -delete
      - name: Clean microsite (avoid stale files from previous builds)
        run: rm -rf build/microsite
      - name: Generate site
        run: ./dtcw generateSite
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/microsite/output
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
